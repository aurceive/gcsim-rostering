# roster_lab configuration contract
# Runnable example and complete list of supported settings and alternatives.
# Add new YAML capabilities here. Configuration keys are checked; optimizer
# option keys are engine-specific.
#
# Default files: input/roster_lab/roster_lab.yaml and sim_config.dart.
# -useExamples selects this file and sim_config.example.dart instead.

version: 1 # Required; currently the only supported version.

project:
  name: roster_lab_demo # Required; used in the output filename.
  target_character: arlecchino # Required; currently only one character.
  # sim_config: custom_sim_config.dart # Default: adjacent sim_config.dart (or example).
  # Relative paths are resolved from this YAML file's directory; absolute paths work too.

engine: gcsim # Default; engine names are directories under engines/.
# engine: wfpsim
# engine: custom
# engine: wfpsim-custom
# engine: kqmsim
# engine: kqmsim-custom
# engine_path: C:/path/to/engine-checkout # Overrides engine; resolved by the engine resolver.

target: team_dps # Default: team damage.
# target: char_dps # Target character damage.
# target: personal_dps # Alias of char_dps.

optimize_substats: true # Default; enables the engine's -substatOptimFull.
# optimize_substats: false

# Global optimizer standards apply to every scenario with optimization enabled.
# Each variant multiplies its runs; a scenario's list replaces the global list.
# Without either list, one "kqms" variant without options is used.
# With optimization disabled, options are ignored and variants do not multiply runs.
# Multiple variants require distinct names. Option keys: letters, digits, underscores.
optimizer_variants:
  - name: kqms
    options:
      talent_level: 10 # Target character only; not passed as an engine option.
      total_liquid_substats: 20
      indiv_liquid_cap: 10
      fixed_substats_count: 2
  # - name: high
  #   options:
  #     talent_level: 10
  #     total_liquid_substats: 30
  #     indiv_liquid_cap: 12
  #     fixed_substats_count: 1

output:
  directory: output/roster_lab # Default; relative to repository root.

resume:
  mode: auto # Default; latest ODS within max_age_hours.
  # mode: off # Ignore old results.
  # mode: all # Latest ODS regardless of age.
  max_age_hours: 24 # Default; applies only to auto.
  # A CLI path is also supported: -resume output/roster_lab/result.ods
  # Completed runs are reused; failed runs are repeated. auto/all prompt when
  # project metadata differs; an explicit path merges without a prompt.

# Scenarios are independent, not cross-multiplied; enabled defaults to false.
# Every scenario can override target, optimize_substats and optimizer_variants
# (see weapons and growth); scenario variants completely replace global ones.
scenarios:
  weapons:
    enabled: true
    # target: char_dps
    # optimize_substats: false

    available_weapon: deathmatch 1 # Baseline; default: equipped weapon.
    # available_weapon: deathmatch # Refine is optional.
    minimum_rarity: 5 # Default: 3; explicit items may be below the threshold.
    # minimum_rarity: 3

    # A nonempty list replaces the default class+rarity selection. Items accept
    # engine keys or exact Russian names, followed by zero or more refines.
    # Without refines: 3* R5, 5* R1, 4* R5 for non-limited sources, else R1+R5.
    items:
      - deathmatch 1
      # - deathmatch 1 5
      # - Небесное крыло 2 3

    # Alternative map form; append: true adds to the default selection.
    # items:
    #   append: true # false replaces the default selection.
    #   items:
    #     - deathmatch 1

    # optimizer_variants:
    #   - name: weapon-only
    #     options:
    #       talent_level: 9
    #       total_liquid_substats: 20
    #       indiv_liquid_cap: 10
    #       fixed_substats_count: 2

    # Omit main_stats (or all three lists) to use sim_config.dart's base stats.
    # Otherwise all lists are required; their Cartesian product is deduplicated.
    main_stats:
      sands:
        - atk%=0.466
        # - er=0.518
        # - em=187
      goblet:
        - pyro%=0.466
        # - em=187
      circlet:
        - cd=0.622
        # - cr=0.311

  growth:
    # enabled: true
    # optimizer_variants:
    #   - name: growth-only
    #     options:
    #       talent_level: 9
    #       total_liquid_substats: 20
    #       indiv_liquid_cap: 10
    #       fixed_substats_count: 2
    # main_stats: # Same rules as weapons; omitted uses the base stats.
    #   sands: [atk%=0.466, er=0.518]
    #   goblet: [pyro%=0.466]
    #   circlet: [cr=0.311, cd=0.622]

  constellations:
    # enabled: true
    scope: character # Default; only target_character is supported.
    # scope: team # Reserved; currently rejected.
    # Omit characters to vary target_character from its current C through C6.
    # One entry only: "<character> [bound] [bound] [+N] [-N]".
    # One bound means baseline..N; two mean lower..upper.
    # +N includes C N; -N excludes it and takes precedence.
    characters: [arlecchino 0 1]
    # characters: [arlecchino]
    # characters: [arlecchino 4]
    # characters: [arlecchino 2 5 +0 -3]
    max_additional: 1 # Nonnegative cap on additional levels; omit for no cap.
    # max_additional: 0

  sets:
    # enabled: true
    scope: character # Default; scope: team is reserved and rejected.
    # Engine keys or exact Russian names; no count means 4 pieces.
    # Counts are allowed sizes; combinations must total exactly 4 pieces.
    # Two sets with "2 4" produce both 4pc sets and their 2pc+2pc mix.
    items:
      - goldentroupe
      - Изумрудная тень 2 4

  levels:
    # enabled: true
    scope: character # Default; scope: team is reserved and rejected.
    # Fixed rows: 80/80 (talents 8-8-8), 80/90, 90/90, 95/95, 100/100.
    # 90/90 is the 100% baseline.

  talents:
    # enabled: true
    scope: character # Default; scope: team is reserved and rejected.
    matrix: default # Default and currently the only supported matrix.
    # Base: 1-1-1, 6-6-6, 8-8-8, 9-9-9, 10-10-10.
    # auto: 7-6-6 through 10-6-6; skill: 6-7-6 through 6-10-6;
    # burst: 6-6-7 through 6-6-10.

  # Levels and talents ignore optimizer talent_level: they own talent mutations.
